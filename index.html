<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://tdx.transportdata.tw; img-src 'self' data: blob:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="等哪班">
<meta name="theme-color" content="#e9eef0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1114" media="(prefers-color-scheme: dark)">
<title>等哪班</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* 版面：上方「站牌」路線圖 → 大型 LED 下一班看板 → 其他路線清單。站牌的琥珀色點陣字是唯一的強調。 */
:root{
  --bg:#e9eef0; --surface:#f8fafb; --ink:#14212a; --muted:#5b6b75; --line:#d3dce1;
  --route:#2a7a6f;          /* 站牌路線圖的線色 */
  --board:#10171b; --board-edge:#26323a; --board-ink:#c9d3d8;
  --led:#ffb21e; --led-glow:rgba(255,178,30,.35); --led-hot:#ff6b3d; --led-off:#59646a;
  --warn-bg:#fff0cf; --warn-ink:#6a4700;
  --f-body:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --f-led:"DotGothic16","Noto Sans TC",ui-monospace,monospace;
  --r:16px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0c1114; --surface:#141c21; --ink:#e4ebef; --muted:#8c9ca6; --line:#24313a;
  --route:#4fb3a4;
  --board:#05080a; --board-edge:#1d282f; --board-ink:#b8c4ca;
  --led:#ffb21e; --led-glow:rgba(255,178,30,.45); --led-hot:#ff7a4d; --led-off:#4d575c;
  --warn-bg:#33280c; --warn-ink:#ffd88a; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;
  padding:calc(env(safe-area-inset-top,0px) + 8px) max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font:inherit;cursor:pointer;color:inherit;background:none;border:0;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--route);outline-offset:2px;border-radius:8px}

/* 頂列 */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:6px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--board);display:grid;place-items:center}
.brand-mark i{width:10px;height:10px;border-radius:50%;background:var(--led);box-shadow:0 0 10px var(--led-glow)}
.brand h1{font-size:19px;font-weight:900;margin:0;letter-spacing:.08em}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.icon-btn svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-btn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.top .btns{display:flex;gap:8px}

/* 組合切換 */
.seg{display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow-x:auto}
.seg button{flex:1 0 auto;padding:7px 14px;border-radius:10px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* 站牌路線圖 */
.trip{display:grid;grid-template-columns:18px 1fr;column-gap:12px;row-gap:2px;padding:4px 4px 0}
.trip .dot{width:14px;height:14px;border-radius:50%;border:3px solid var(--route);background:var(--bg);margin:5px 2px 0;position:relative;z-index:1}
.trip .dot.end{background:var(--route)}
.trip .rail{width:3px;background:var(--route);margin-left:7.5px;height:22px;opacity:.55;border-radius:2px}
.trip .lbl{font-size:12px;color:var(--muted);letter-spacing:.1em}
.trip .stop{font-size:18px;font-weight:700;line-height:1.3;min-width:0;overflow-wrap:anywhere}

/* LED 看板 */
.board{background:var(--board);border:1px solid var(--board-edge);border-radius:20px;padding:18px 18px 16px;color:var(--board-ink);position:relative;overflow:hidden}
.board::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1.2px);background-size:5px 5px}
.board-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.14em;position:relative}
.live{display:flex;align-items:center;gap:6px;color:var(--board-ink);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.live i{width:7px;height:7px;border-radius:50%;background:#3ad07a;box-shadow:0 0 8px rgba(58,208,122,.7)}
.live.stale i{background:var(--led-off);box-shadow:none}
.hero{display:grid;grid-template-columns:1fr auto;align-items:end;gap:12px;margin-top:14px;position:relative}
.hero-route{font-family:var(--f-led);font-size:clamp(26px,8vw,36px);line-height:1.1;color:var(--led);text-shadow:0 0 14px var(--led-glow);min-width:0;overflow-wrap:anywhere}
.hero-sub{font-size:13px;color:var(--board-ink);margin-top:6px}
.hero-eta{font-family:var(--f-led);color:var(--led);text-shadow:0 0 18px var(--led-glow);text-align:right;line-height:.9;white-space:nowrap;font-variant-numeric:tabular-nums}
.hero-eta .n{font-size:clamp(64px,22vw,92px)}
.hero-eta .u{font-size:20px;margin-left:4px}
.hero-eta.word{font-size:clamp(28px,9vw,40px);line-height:1.1}
.hot{color:var(--led-hot)!important;text-shadow:0 0 16px rgba(255,107,61,.5)!important}
.dim{color:var(--led-off)!important;text-shadow:none!important}
.board-empty{font-family:var(--f-led);color:var(--led-off);font-size:20px;padding:18px 0 8px;position:relative}

/* 3D 道路場景 */
.scene{position:relative;height:170px;margin:10px -18px 0;overflow:hidden}
.scene canvas{display:block;width:100%;height:100%}
.scene::after{content:"";position:absolute;inset:auto 0 0 0;height:40px;background:linear-gradient(transparent,var(--board));pointer-events:none}
.tags{position:absolute;inset:0;pointer-events:none}
.tag{position:absolute;transform:translate(-50%,-150%);font-size:11px;font-weight:700;color:var(--board);background:var(--led);
  padding:1px 6px;border-radius:5px;white-space:nowrap;transition:opacity .3s}
.tag.is-hot{background:var(--led-hot)}
.tag.stop{background:var(--route);color:#fff}

/* 其他路線 */
.sect{font-size:12px;color:var(--muted);letter-spacing:.14em;margin:4px 4px -6px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:14px;padding:13px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.rinfo{min-width:0}
.rname{font-size:17px;font-weight:700;line-height:1.3}
.rsub{font-size:12.5px;color:var(--muted)}
.eta{min-width:84px;height:44px;border-radius:10px;background:var(--board);color:var(--led);font-family:var(--f-led);
  display:flex;align-items:baseline;justify-content:center;padding:6px 10px 0;font-variant-numeric:tabular-nums}
.eta .n{font-size:26px;line-height:1}
.eta .u{font-size:12px;margin-left:3px}
.eta.word{align-items:center;padding-top:0;font-size:15px;letter-spacing:.04em}
.list .empty{padding:20px 16px;color:var(--muted);font-size:14px;text-align:center}

.note{background:var(--warn-bg);color:var(--warn-ink);border-radius:12px;padding:10px 14px;font-size:14px}
.demo{font-size:12px;color:var(--muted);text-align:center}

/* 新手引導：只在還沒設定好時出現 */
.guide{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px 16px;display:flex;flex-direction:column;gap:14px}
.guide h2{margin:0;font-size:17px;font-weight:900;letter-spacing:.04em}
.guide .lead{margin:-8px 0 0;font-size:13px;color:var(--muted)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:28px 1fr;column-gap:12px;position:relative;padding-bottom:16px}
.step:last-child{padding-bottom:0}
.step:not(:last-child)::before{content:"";position:absolute;left:13px;top:30px;bottom:2px;width:2px;background:var(--line)}
.step.done:not(:last-child)::before{background:var(--route)}
.num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;border:2px solid var(--line);color:var(--muted);background:var(--surface);position:relative;z-index:1}
.step.done .num{background:var(--route);border-color:var(--route);color:#fff}
.step.now .num{border-color:var(--led);background:var(--board);color:var(--led)}
.step-t{font-weight:700;font-size:15px;line-height:28px;color:var(--muted)}
.step.now .step-t,.step.done .step-t{color:var(--ink)}
.step-b{grid-column:2;display:flex;flex-direction:column;gap:10px;font-size:14px;margin-top:4px}
.step-b ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.urlbox{display:flex;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 6px 6px 12px}
.urlbox a{flex:1;min-width:0;color:var(--route);font-weight:500;text-decoration:none;overflow-wrap:anywhere;font-size:14px}
.urlbox .btn{padding:6px 12px;font-size:13px}
.hint{font-size:12.5px;color:var(--muted)}
.hint b{color:var(--ink);font-weight:500}

@media (prefers-reduced-motion:no-preference){
  .blink{animation:blink 1.1s steps(2) infinite}
  .live:not(.stale) i{animation:pulse 2s ease-in-out infinite}
}
@keyframes blink{50%{opacity:.4}}
@keyframes pulse{50%{opacity:.35}}

/* 設定 */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.panel h2{font-size:16px;margin:0;font-weight:700}
.panel p{margin:-6px 0 0;font-size:13px;color:var(--muted)}
label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.inline{display:flex;gap:8px;align-items:center}
.inline>input{flex:1}
.btn{padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:500;white-space:nowrap}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.btn.ghost{background:none}
.btn.danger{color:var(--led-hot)}
.pair{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.pair:first-child{border-top:0;padding-top:0}
.pair>div:first-child{min-width:0}
.pair b{font-size:15px}
.small{font-size:13px;color:var(--muted)}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.back{align-self:flex-start}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><div class="brand-mark"><i></i></div><h1>等哪班</h1></div>
    <div class="btns">
      <button class="icon-btn" id="btnRefresh" type="button" aria-label="更新"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg></button>
      <button class="icon-btn" id="btnSettings" type="button" aria-label="設定"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
    </div>
  </div>

  <!-- 看板 -->
  <div id="board" class="wrap" style="gap:16px;max-width:none">
    <div class="seg" id="chips" role="group" aria-label="起訖站組合"></div>
    <div class="trip" id="trip"></div>
    <section class="guide" id="guide" hidden></section>
    <div class="note" id="msg" hidden></div>
    <div class="board" id="led">
      <div class="board-head"><span>即將進站</span><span class="live stale" id="live"><i></i><span id="stamp">--:--:--</span></span></div>
      <div class="scene" id="scene"><div class="tags" id="tags"></div></div>
      <div id="hero"><div class="board-empty">載入中…</div></div>
    </div>
    <div class="sect" id="otherTitle" hidden>其他可搭路線</div>
    <div class="list" id="list" hidden></div>
    <div class="demo" id="demoNote" hidden>看板目前是示範畫面，完成上方步驟後就會顯示即時到站。</div>
  </div>

  <!-- 設定 -->
  <div id="settings" class="wrap" style="gap:16px;max-width:none" hidden>
    <button class="btn ghost back" id="btnBack" type="button">← 回到看板</button>
    <section class="panel">
      <h2>TDX 金鑰</h2>
      <p>只存在這支手機的瀏覽器裡，不會上傳到任何地方。</p>
      <label>Client ID<input id="cid" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
      <label>Client Secret<input id="csec" type="password" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
      <div class="inline" style="justify-content:space-between"><span class="small" id="keyStatus"></span><button class="btn primary" id="btnSaveKey" type="button">儲存並測試</button></div>
    </section>

    <section class="panel">
      <h2>起訖站組合</h2>
      <div id="pairList"></div>
    </section>

    <section class="panel">
      <h2>新增組合</h2>
      <label>名稱<input id="pName" placeholder="例如：上班"></label>
      <label>上車站
        <span class="inline"><input id="kwFrom" placeholder="輸入站名關鍵字"><button class="btn" id="sFrom" type="button">搜尋</button></span>
        <select id="selFrom" hidden></select>
      </label>
      <label>下車站
        <span class="inline"><input id="kwTo" placeholder="輸入站名關鍵字"><button class="btn" id="sTo" type="button">搜尋</button></span>
        <select id="selTo" hidden></select>
      </label>
      <button class="btn primary" id="btnAdd" type="button">新增並找出路線</button>
      <div class="small" id="addStatus"></div>
    </section>
  </div>
</div>

<script src="three.min.js"></script>
<script src="app.js"></script>
</body>
</html>
